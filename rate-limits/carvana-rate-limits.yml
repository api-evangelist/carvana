evidence:
  - url: https://api-developer.carvana.com/developer/apis?api-version=2022-04-01-preview
    status: 200
    body: '{"value":[],"nextLink":null}'
    note: >-
      The developer portal's own management proxy answers anonymously and returns an empty API list,
      so no APIM product policy — the place an Azure-hosted rate limit would be declared — is
      readable without an approved partner account.
  - url: https://api.carvana.com/v1/vehicles
    status: 404
    note: No rate-limit headers present on the response.
  - url: https://api.collective.carvana.com/
    status: 401
    note: 'WWW-Authenticate: Basic. No rate-limit headers present on the challenge.'
