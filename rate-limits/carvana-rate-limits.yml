  live header inspection of api.carvana.com and api.collective.carvana.com, 2026-09-05
tags:
  - Automotive
  - Partner API
  - Rate Limiting
limit_count: 0
description: >-
  Carvana publishes NO rate limits. The Partner API developer portal exposes zero APIs and zero
  products to an anonymous visitor, so no product-level throttling policy is readable; the Collective
  host answers 401 for every path; and the api.carvana.com gateway returns no RateLimit-*,
  X-RateLimit-* or Retry-After header on any observed response. An honest zero: limits exist
  somewhere in Carvana's Azure APIM subscription policy, but nothing about them is published, so a
  partner cannot size an integration before signing.
notes: >-
  Supersedes a 2026-05-04 bulk-sweep record that listed two speculative limit entries ("see partner
  Azure APIM subscription policy", "per AWS Data Exchange subscription terms"). Neither was a
  published number and the AWS Data Exchange entry rested on a listing that turns out to be
  third-party (see plans/carvana-plans-pricing.yml). Both removed.
