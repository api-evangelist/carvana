aid: carvana
name: Carvana
description: >-
  Carvana is an e-commerce platform for buying, selling, and financing used
  cars online, with home delivery or pickup at its car vending machines. Its
  developer-facing surface is the Carvana Partner REST API on Azure API
  Management at api-developer.carvana.com, which lets authorized rental
  companies, wholesalers and fleet partners post, update and manage inventory
  in Carvana's catalog. A second surface, the Carvana Collective API, answers
  every request with an HTTP Basic challenge whose realm is "Collective API
  Reference". Both are closed: the portal's own management proxy returns an
  empty API and product list to anonymous callers, so no contract, product,
  quota or price is readable until Carvana LLC authorizes a partner. What
  Carvana does publish for machines is an llms.txt at www.carvana.com/llms.txt
  and a Bugcrowd-hosted responsible disclosure programme.
