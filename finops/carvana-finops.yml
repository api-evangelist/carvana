reconciled: false
tags:
  - Automotive
  - Partner API
  - FinOps
  - FOCUS
description: >-
  FOCUS-aligned FinOps for Carvana's partner integration surface. There is exactly one billing shape:
  a partner-negotiated contract for the Partner / Collective APIs, with no public per-call price and
  no self-service tier. Nothing Carvana publishes lets a consumer forecast spend before signing.
notes: >-
  Partner API pricing is private and no APIM product is visible anonymously. CORRECTED 2026-09-05: an
  earlier version of this file treated the AWS Data Exchange listing "Carvana Car Sales for United
  States" as a Carvana revenue surface. That listing is published by Saturn Data, a third-party
  aggregator, not by Carvana; its meters have been removed.
sources:
  - https://api-developer.carvana.com/
  - https://api-developer.carvana.com/developer/products?api-version=2022-04-01-preview
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Carvana, LLC
serviceCategory: Automotive Data + Partner Integration
billingModel:
  pricingCategory: Custom (Partner Contract)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
focusColumns:
  ServiceName: Carvana Partner APIs
  ServiceCategory: Automotive Data
  ProviderName: Carvana
  PublisherName: Carvana, LLC
  InvoiceIssuerName: Carvana, LLC
  BillingCurrency: USD
meters:
  - name: partner_api_requests
    unit: request
    aggregation: sum
    dimensions:
      - subscription_key
      - operation
  - name: inventory_records_managed
    unit: record
    aggregation: count
    dimensions:
      - partner
      - operation
principles:
  - name: Visibility
    description: Rely on the per-partner reporting Carvana surfaces during onboarding; no anonymous
      product, quota or price is readable from the developer portal, so spend cannot be modelled
      before the contract is signed.
  - name: Allocation
    description: Allocate Partner API contract fees to the inventory-operations function that owns the
      Carvana relationship; there is no per-call meter to allocate against.
  - name: Optimization
    description: Batch inventory updates rather than polling. With no published rate limits or quotas,
      negotiate the throttling policy explicitly in the partner agreement.
  - name: Accountability
    description: Assign a single inventory-operations owner for the Carvana Partner contract and review
      the negotiated terms on renewal.
