description: >-
  Carvana publishes NO API plans and NO API pricing of any kind. The Azure API Management developer
  portal that fronts the Partner API renders a "Products" navigation item, but its own management
  proxy returns {"value":[],"nextLink":null} for both /developer/apis and /developer/products to an
  anonymous caller — there is not one product, tier, quota or price visible before Carvana LLC
  approves a partner. The Collective host answers 401 for every path. Access is negotiated
  bilaterally; there is nothing to compare, budget against, or sign up for online.
notes: >-
  CORRECTION 2026-09-05. The 2026-05-04 bulk-sweep record listed three plans, one of which —
  "Carvana Car Sales Data (AWS Data Exchange)" — was misattributed. That AWS Marketplace listing
  (prodview-y77x3t6zisn4w) is published by SATURN DATA, a third-party data aggregator
  (support@saturndatacloud.com, sample data at github.com/saturndatacloud/datasets), not by Carvana.
  It is a scraped dataset ABOUT Carvana inventory, and crediting Carvana with publishing it would
  have credited the company with a commercial data product it does not sell. The other two entries
  were "contact sales" placeholders carrying no published terms, which is a plan_count of 0, not 2.
evidence:
  - url: https://api-developer.carvana.com/developer/products?api-version=2022-04-01-preview
    status: 200
    body: '{"value":[],"nextLink":null}'
    note: Zero APIM products visible anonymously — no published tier, quota or price.
  - url: https://api-developer.carvana.com/
    status: 200
    note: >-
      Portal copy reads "This API requires authorization by Carvana LLC." Sign-up exists; entitlement
      does not follow from it.
  - url: https://api.collective.carvana.com/
    status: 401
    note: HTTP Basic challenge, realm "Collective API Reference".
  - url: https://aws.amazon.com/marketplace/pp/prodview-y77x3t6zisn4w
    status: 200
    note: >-
      Seller is Saturn Data, not Carvana. Free subscription, monthly refresh, CSV over AWS Data
      Exchange. Retained here only as the evidence for the misattribution correction above.
